name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Build debug + release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/gn-reader-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/gn-reader-release-unsigned.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/gn-reader-release.apk
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: gn-reader-apks
          path: dist/*

      # 推送 v* tag 时自动建 GitHub Release（无需本机编译）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            GN Reader 自动构建产物。
            - `gn-reader-debug.apk`：可直接安装调试
            - `gn-reader-release-unsigned.apk`：未签名正式包（可用自有 keystore 签名后再分发）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
